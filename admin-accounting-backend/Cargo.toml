[package]
name = "admin-accounting-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Clean architecture boilerplate for the admin accounting backend"
license = "MIT"

[lib]
name = "admin_accounting_backend"
path = "src/lib.rs"

[[bin]]
name = "admin-accounting-backend"
path = "cmd/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
redis = { version = "1", default-features = false, features = ["tokio-comp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["chrono", "macros", "migrate", "postgres", "runtime-tokio", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "trace", "request-id"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
validator = { version = "0.21", features = ["derive"] }
